<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b1a52"/>
      <stop offset="45%" stop-color="#6b3fa0"/>
      <stop offset="75%" stop-color="#f2703c"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ff9d3d"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="80" cy="80" r="76"/>
    </clipPath>
  </defs>

  <!-- background circle -->
  <circle cx="80" cy="80" r="76" fill="url(#skyGrad)" stroke="#1a1030" stroke-width="4"/>

  <g clip-path="url(#circleClip)">
    <!-- horizon -->
    <rect x="0" y="112" width="160" height="48" fill="#150d2b"/>

    <!-- rising sun -->
    <circle cx="80" cy="112" r="34" fill="url(#sunGrad)"/>

    <!-- radar / alert sweep arcs signaling the disaster-alert feature -->
    <g stroke="#ffffff" stroke-opacity="0.85" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M 40 88 A 56 56 0 0 1 120 88"/>
      <path d="M 52 74 A 40 40 0 0 1 108 74" stroke-opacity="0.55"/>
    </g>

    <!-- alert ping -->
    <circle cx="80" cy="88" r="5" fill="#ff5252"/>
    <circle cx="80" cy="88" r="10" fill="none" stroke="#ff5252" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <circle cx="80" cy="80" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>